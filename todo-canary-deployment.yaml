apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-canary-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-canary
  template:
    metadata:
      labels:
        app: todo-canary
    spec:
      containers:
        - name: todo
          image: devops-todo:canary-v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
